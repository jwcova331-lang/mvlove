<script>
/* ===== 접속자 캐릭터 동기화 (Firestore players 컬렉션 사용) ===== */
(()=>{
const SEND_MS=800, HEARTBEAT_MS=40000, STALE_MS=90000;
const R={};            // uid -> {C, tx,tz,ty,try_, sit, zn, ts, lk}
const PD={};           // uid -> 상대 문서 전체 (음식 동기화용)
let dn=0, lastDsh='', prevRemote=new Set(), ownCount=0, werr=''; const ignored=new Set();
let db=null, me=null, started=false;
const sig=o=>JSON.stringify(o);

async function boot(){
  try{
    if(!window.claude||!claude.use)return;
    const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!d||!u)return; db=d; me=await u.id(); if(!me)return;
    wait();
  }catch(e){console.error('sync boot',e)}
}
function wait(){ if(typeof P!=='undefined'&&P){start();return} setTimeout(wait,500) }

function start(){
  if(started)return; started=true;
  /* 내 정보 보내기 */
  let last={x:1e9,z:1e9,ry:0,sit:null,zn:-1}, lastSend=0, lastLook='', lastP=null, lastDshSend=0;
  setInterval(()=>{
    if(document.hidden||typeof P==='undefined'||!P)return;
    const now=Date.now(), p=P.g.position;
    const moved=Math.hypot(p.x-last.x,p.z-last.z)>.12 || Math.abs(P.ry-last.ry)>.4 || !!P.sit!==last.sit || zone!==last.zn;
    const lk=sig(look());
    const lookChanged=lk!==lastLook || P!==lastP;
    const dl=ownDishes(), ds=sig(dl), dshChanged=ds!==lastDsh; ownCount=dl.length;
    if(!moved && !lookChanged && !dshChanged && now-lastSend<HEARTBEAT_MS)return;   // (음식은 변화가 있을 때와 20초마다 보냄)
    const np=Object.keys(R).length, gap=np<=10?700:np<=25?1200:2000;   // 사람이 많을수록 덜 자주 보냄
    if(now-lastSend<gap)return;
    lastSend=now; last={x:p.x,z:p.z,ry:P.ry,sit:!!P.sit,zn:zone};
    const data={nick,ts:now,x:+p.x.toFixed(2),y:+p.y.toFixed(2),z:+p.z.toFixed(2),ry:+P.ry.toFixed(2),sit:!!P.sit,zn:zone,gone:false};
    if(lookChanged){data.lk=lk;lastLook=lk;lastP=P}
    if(dshChanged||now-lastDshSend>20000){data.dsh=dl;lastDsh=ds;lastDshSend=now}
    db.doc('players/'+me).set(data,{merge:true}).then(()=>{werr=''}).catch(e=>{werr='저장:'+String((e&&(e.code||e.message))||e).slice(0,28)});
  },400);
  /* 앱을 내리면 '자리 비움' 처리 */
  document.addEventListener('visibilitychange',()=>{ if(document.hidden&&db&&me) db.doc('players/'+me).set({gone:true},{merge:true}).catch(()=>{}); else {lastSend=0} });
  addEventListener('pagehide',()=>{ if(db&&me) db.doc('players/'+me).set({gone:true},{merge:true}).catch(()=>{}) });

  /* 다른 사람 받기 */
  db.collection('players').where('ts','>',Date.now()-120000).onSnapshot(s=>{
    s.docChanges().forEach(ch=>{
      const id=ch.doc.id; if(id===me)return;
      if(ch.type==='removed'){drop(id);delete PD[id];return}
      const x=ch.doc.data()||{};
      PD[id]=x;
      if(typeof x.x!=='number'||!x.lk)return;   // 아직 위치/외형이 없는 옛 데이터
      upsert(id,x);
    });
  },e=>{console.error('players listen',e);werr='읽기:'+String((e&&(e.code||e.message))||e).slice(0,28)});

  requestAnimationFrame(tick);
  setInterval(()=>{try{syncDishes()}catch(e){console.error('dish sync',e)}},700);
  setInterval(()=>{ const n=Date.now(); Object.keys(R).forEach(id=>{ if(n-R[id].ts>STALE_MS||R[id].gone)hide(id,true) }) },3000);
}

/* ---- 의자 공유: 앉은 사람 자리는 막고, 몸이 겹치지 않게 밀어내기 ---- */
let seatT=0;
function seatSync(n){
  if(n-seatT<250)return; seatT=n;
  CH.forEach(s=>{ if(s.o===2)s.o=null });
  const now=Date.now();
  Object.keys(R).forEach(id=>{
    const r=R[id]; if(!r.sit||r.gone||now-r.ts>STALE_MS)return;
    let best=null,bd=.5;
    CH.forEach(s=>{const d=Math.hypot(s.x-r.tx,s.z-r.tz);if(d<bd){bd=d;best=s}});
    if(!best)return;
    if(best===seat){
      if(id<me&&!act){ $('bSit').onclick(); toast('다른 손님이 먼저 앉았어요. 다른 자리에 앉아 주세요') }   // 동시에 앉으면 uid가 작은 쪽이 우선
    }else if(!best.o)best.o=2;
  });
}

/* ---- 테이블 음식 공유 ---- */
function ownDishes(){
  const out=[];
  TB.forEach((t,ti)=>t.sl.forEach((sl,si)=>{
    try{
      const d=sl.it; if(!d||!d.m||!d.m.k)return;
      if(!d.nid&&!d.rid)d.nid=me+'-'+(++dn)+'-'+Date.now().toString(36);
      out.push({i:d.nid||d.rid,ti,si,k:String(d.m.k),n:String(d.m.n||''),e:String(d.m.e||''),p:+d.m.p||0,t:d.m.t==='drink'?'drink':'eat',l:(+d.left)||0});
    }catch(err){console.error('dish list',err)}
  }));
  return out;
}
function applyLeft(d,l){ let g=20; while(d.left>l&&g-->0)bite(d) }
function syncDishes(){
  const now=Date.now(), eff={};
  Object.keys(PD).forEach(uid=>{
    const x=PD[uid]; if(!x||!Array.isArray(x.dsh))return;
    if(now-(x.ts||0)>STALE_MS||x.gone)return;
    x.dsh.forEach(r=>{
      if(!r||typeof r.i!=='string'||typeof r.l!=='number')return;
      const own=r.i.startsWith(uid+'-'), e=eff[r.i];
      if(!e)eff[r.i]={i:r.i,ti:r.ti,si:r.si,k:r.k,n:r.n,e:r.e,p:r.p,t:r.t,l:r.l,own};
      else{e.l=Math.min(e.l,r.l);if(own){e.ti=r.ti;e.si=r.si;e.k=r.k;e.n=r.n;e.e=r.e;e.p=r.p;e.t=r.t;e.own=true}}
    });
  });
  const here={};
  TB.forEach((t,ti)=>t.sl.forEach((sl,si)=>{const d=sl.it;if(d){const id=d.nid||d.rid;if(id)here[id]={d,sl}}}));
  prevRemote.forEach(id=>{ if(!here[id])ignored.add(id) });   // 직원이 치워서 사라진 접시는 다시 안 띄움
  Object.keys(here).forEach(id=>{
    const h=here[id],e=eff[id];
    if(h.d.rid){
      if(!e||!e.own){ try{h.sl.p.remove(h.d.g)}catch(_){} h.sl.it=null; return }   // 주인이 나감
      if(e.l<h.d.left)applyLeft(h.d,e.l);
    }else if(e&&e.l<h.d.left)applyLeft(h.d,e.l);   // 내 음식을 다른 사람이 먹은 경우
  });
  Object.keys(eff).forEach(id=>{
    const e=eff[id];
    if(!e.own||here[id]||ignored.has(id)||e.l<=0)return;
    let m=MENU.find(x=>x.k===e.k); if(!m&&e.t)m={k:e.k,n:e.n||'',e:e.e||'',p:e.p||0,t:e.t};   // 카페 메뉴처럼 MENU에 없는 것도 복원
    const t=TB[e.ti]; if(!m||!t||typeof B[m.k]!=='function')return;
    const eat=m.t==='eat', ok=(x,k)=>!x.it&&(eat?k<3:k>=3);
    let sl=t.sl[e.si]; if(!(sl&&ok(sl,e.si)))sl=t.sl.find((x,k)=>ok(x,k));
    if(!sl)return;
    const d=mkDish(m); d.rid=id; applyLeft(d,e.l);
    d.g.scale.setScalar(eat?.78:1); d.g.position.set(0,0,0); sl.p.add(d.g); sl.it=d;
  });
  prevRemote=new Set();
  TB.forEach(t=>t.sl.forEach(sl=>{if(sl.it&&sl.it.rid)prevRemote.add(sl.it.rid)}));
}

function upsert(id,x){
  let r=R[id];
  const seenLook=x.lk;
  if(!r||r.lk!==seenLook){
    const old=r; if(old)kill(old);
    let o; try{o=JSON.parse(seenLook)}catch(e){return}
    o.name=(x.nick||'손님').slice(0,8);
    let C; try{C=makeChar(o)}catch(e){console.error(e);return}
    r={C,lk:seenLook,px:x.x,pz:x.z,mv:false};
    R[id]=r; C.g.position.set(x.x,x.y||0,x.z); C.ry=x.ry||0; C.g.rotation.y=C.ry;
  }
  {const nw=Date.now();if(r.lu){const g=Math.min(2500,nw-r.lu);r.gap=r.gap?r.gap*.7+g*.3:g}r.lu=nw}
  r.tx=x.x; r.tz=x.z; r.ty=x.y||0; r.try_=x.ry||0; r.sit=!!x.sit; r.zn=x.zn; r.ts=x.ts||Date.now(); r.gone=!!x.gone;
  if(r.C.nm!==(x.nick||'손님').slice(0,8)){r.C.nm=(x.nick||'손님').slice(0,8);r.C.lb.lastChild.textContent=r.C.nm}
  if(!r.gone)show(id);
}
function kill(r){ try{S.remove(r.C.g)}catch(e){} try{r.C.lb.remove()}catch(e){} }
function drop(id){ const r=R[id]; if(!r)return; kill(r); delete R[id] }
function hide(id,rm){ const r=R[id]; if(!r)return; if(rm){drop(id);return} r.C.g.visible=false; r.C.lb.style.display='none' }
function show(id){ const r=R[id]; if(r){r.C.g.visible=true} }

let lt=performance.now(), allow=null, allowT=0;
function tick(){
  requestAnimationFrame(tick);
  const n=performance.now(), dt=Math.min((n-lt)/1000,.05); lt=n;
  const pp=P.g.position, ids=Object.keys(R);
  if(n-allowT>500){allowT=n;allow=ids.length>30?new Set(ids.map(id=>{const q=R[id].C.g.position;return[id,(q.x-pp.x)**2+(q.z-pp.z)**2]}).sort((a,b)=>a[1]-b[1]).slice(0,30).map(a=>a[0])):null}
  seatSync(n);
  ids.forEach(id=>{
    const r=R[id], C=r.C, p=C.g.position;
    const vis=(r.zn===zone)&&!r.gone&&(!allow||allow.has(id));
    C.g.visible=vis; C.lb.style.display=vis?'':'none';
    if(!vis)return;
    if(!seat&&!P.sit){const ox=pp.x-p.x,oz=pp.z-p.z,od=Math.hypot(ox,oz),lim=r.sit?.65:.8;if(od<lim&&od>.001){const ps=Math.min(.06,(lim-od)*.5);pp.x+=ox/od*ps;pp.z+=oz/od*ps}}   // 서 있을 때 다른 사람과 몸이 겹치면 살짝 밀려남
    const dx=r.tx-p.x, dz=r.tz-p.z, d=Math.hypot(dx,dz);
    if(d>6){p.x=r.tx;p.z=r.tz}                 // 너무 멀면 순간이동
    else{const k=Math.min(1,dt*Math.max(1.5,Math.min(8,4500/Math.max(500,r.gap||800))));p.x+=dx*k;p.z+=dz*k}
    p.y+=(r.ty-p.y)*Math.min(1,dt*10);
    const moving=d>.15&&!r.sit;
    let a=(moving?Math.atan2(dx,dz):r.try_);
    let dr=a-C.g.rotation.y; dr=Math.atan2(Math.sin(dr),Math.cos(dr)); C.g.rotation.y+=dr*Math.min(1,dt*10);
    C.sit=r.sit; if(moving)C.ph+=dt*11;
    if((p.x-pp.x)**2+(p.z-pp.z)**2<484){try{pose(C,dt,moving)}catch(e){}}   // 22칸 넘게 먼 사람은 걷는 동작 생략
    const v=p.clone(); v.y+=2.55; v.project(cam);
    C.lb.style.left=(v.x*.5+.5)*innerWidth+'px'; C.lb.style.top=(-v.y*.5+.5)*innerHeight+'px';
  });
}

window.NETBUBBLE=(uid,text)=>{
  const r=R[uid]; if(!r)return; const b=r.C.lb.firstChild;
  b.textContent=text; b.style.display='block'; clearTimeout(r.C.bt); r.C.bt=setTimeout(()=>b.style.display='none',4200);
};
boot();
})();
</script>

<script>
/* ===== 두 손가락으로 시점 조절: 좌우로 밀기=회전, 위아래로 밀기=각도, 벌리기/오므리기=확대(기존) ===== */
(()=>{
window.CAMU=0; window.CAMP=Math.PI/4;
const cv=document.getElementById('c'); if(!cv)return;
const pts=new Map(); let pm=null, t0=0, moved=0, hinted=false;
const mid=()=>{const a=[...pts.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}};
cv.addEventListener('pointerdown',e=>{
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){pm=mid();t0=performance.now();moved=0}
  else pm=null;
});
cv.addEventListener('pointermove',e=>{
  const o=pts.get(e.pointerId); if(!o)return;
  o.x=e.clientX;o.y=e.clientY;
  if(pts.size!==2||!pm)return;
  const m=mid(), dx=m.x-pm.x, dy=m.y-pm.y;
  moved+=Math.abs(dx)+Math.abs(dy)+Math.abs(m.d-pm.d);
  window.CAMU-=dx*.008;
  window.CAMP=Math.max(.22,Math.min(1.25,window.CAMP+dy*.006));
  pm=m;
});
const end=e=>{
  if(pts.size===2&&performance.now()-t0<250&&moved<8){window.CAMU=0;window.CAMP=Math.PI/4}   // 두 손가락 톡 = 원래 시점
  pts.delete(e.pointerId); pm=null;
};
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,end));
/* 마우스(컴퓨터): 오른쪽 버튼 누르고 끌기 */
let rd=null;
cv.addEventListener('mousedown',e=>{if(e.button===2)rd={x:e.clientX,y:e.clientY}});
addEventListener('mousemove',e=>{if(!rd)return;window.CAMU-=(e.clientX-rd.x)*.008;window.CAMP=Math.max(.22,Math.min(1.25,window.CAMP+(e.clientY-rd.y)*.006));rd={x:e.clientX,y:e.clientY}});
addEventListener('mouseup',()=>{rd=null});
/* 처음 한 번 안내 */
const hint=()=>{ if(hinted)return; if(typeof P!=='undefined'&&P&&typeof toast==='function'){hinted=true;setTimeout(()=>toast('두 손가락으로 좌우·위아래로 밀면 시점이 돌아가요 · 두 손가락으로 톡 치면 원래대로'),7000)} else setTimeout(hint,1000) };
hint();
})();
</script>
</body></html>
